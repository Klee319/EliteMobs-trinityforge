# TrinityForge integration toggles for this EliteMobs fork.
#
# These are INTEGRATION SWITCHES, not balance numbers. All damage/defense/loot/level balance
# lives in TrinityForge's own configuration files (combat/*.yml, dungeon/themes.yml, etc.).
# When TrinityForge is not installed every toggle is ignored and EliteMobs runs standalone.

# Short-circuit EliteMobs' gear-tier damage and defense multipliers to gear-independent values
# (weapon/armor tier no longer changes raw damage). Spec section 1.
gear-neutralization: true

# Recompute the final damage of every elite combat interaction through TrinityForge's symmetric
# pipeline (physical/magical final damage). Spec section 2.
combat-delegation: true

# Replace EliteMobs' internal combat-level source with TrinityForge's skill-tree mapping
# (combatLevelOf). Spec section 3.
combat-level-mapping: true

# Stamp each spawned elite mob's PDC with its TrinityForge defense profile (level, dungeon theme,
# physical/magical defense). Spec section 7.
spawn-profile-stamp: true

# Drive each elite mob's MAX HEALTH from its TrinityForge profile (combat/mob-profiles.yml
# `max-health`) instead of EliteMobs' own exponential level scaling. Only mobs whose profile sets a
# non-zero max-health are affected; every other mob keeps its EliteMobs HP. Applied at every EliteMobs
# HP write (spawn, full-heal, phase-boss reset) so HP stays consistent mid-fight (敵HPをTF化).
hp-delegation: true

# Stamp dropped items with a TrinityForge rollSeed + quality so their stats are derived (and can be
# re-derived on reload) instead of baked. Spec section 5.
loot-stat-stamp: true

# Hate-based targeting: redirect elite targeting to the highest-hate player. Spec section 4.
hate-targeting: true

# Disable repair of EliteMobs items so durability is a finite resource (spec section 8, "修繕廃止").
# Blocks the EliteMobs custom scrap-repair menu and vanilla anvil/mending repair of elite items.
repair-disabled: true

# Mirror EliteMobs soulbinds into TrinityForge ItemData (bind type SOULBOUND + owner UUID) so
# TrinityForge sees the same binding (spec section 8). The EliteMobs binding itself is unchanged.
soulbind-bridge: true

# Suppress EliteMobs' own native combat displays (health bars, numeric HP, boss bars, damage/heal/XP
# popups, and the vanilla nametag) so they don't duplicate TrinityForge's own FocusHp/DamagePopup
# systems. Missing key = suppression ON (default true) so upgrading servers get the fix automatically
# without editing this file. Only takes effect while TrinityForge is detected; in standalone mode
# (TrinityForge absent) EliteMobs always keeps its native displays regardless of this setting.
suppress-native-combat-display: true

# Gate equipping by an item's TrinityForge useLevelRequirement against the player's combat level
# (spec section 8). COARSE placeholder: TrinityForge's public API does not yet expose per-skill
# ValhallaMMO levels, so this compares against the combat-level average. Off by default; the check
# fails open (allows use) on any error or missing requirement.
use-level-restriction: false

# Block dungeon entry below a required combat level. Spec section 6.
# The required levels are an integration table (which dungeon needs which level), keyed by the dungeon's
# content-package filename (its stable logical/blueprint name — e.g. "my_dungeon" for
# content_packages/my_dungeon.yml, NOT the dynamically numbered instance world it clones into, like
# my_dungeon_3). This gate is checked directly when a player creates or joins an instanced dungeon, so it
# always applies regardless of the teleport-timer setting below.
# For dungeons only ever reached through a plain teleport (command/NPC, no dungeon instance), the fallback
# gate below matches on the destination world name instead — list that world's name here if it needs gating.
# Leave empty (or enabled: false) to disable gating entirely.
dungeon-entry-gate:
  enabled: false
  required-combat-level: {}
    # my_dungeon: 20
    # example_dungeon_world: 20
  # Message sent to a player who is denied dungeon entry by the gate. Supports legacy '&' color codes
  # (converted through EliteMobs' standard ChatColorConverter) and the {required}/{current} placeholders.
  message: "&cYou need combat level &e{required}&c to enter this dungeon (yours: &e{current}&c)."

# ---------------------------------------------------------------------------
# EliteMobs 側の頭上表示・バーの個別抑制 (2026-08-01)
# ---------------------------------------------------------------------------
# suppress-native-combat-display は「まとめて抑制する」マスタースイッチです。
# ここに書いたキーだけがマスターを上書きし、書かなかったキーはマスターの値をそのまま使います
# (＝この節を丸ごと消しても従来どおり動きます)。TrinityForge 未導入時はすべて無効
# (EliteMobs は単体プラグインとして自前の表示を保ちます)。
native-display-suppression:
  # バニラの頭上名 (customNameVisible)。カスタムボスの alwaysShowName / 戦闘突入時の再表示 /
  # LibsDisguises 側の名札もまとめてこのキーで抑制します。
  # TrinityForge の FocusHp 表示が名前とレベルを出しているため、既定はマスター (=true) 追従。
  nametag: true
  # FreeMinecraftModels / ModelEngine のモデルが nametag ボーン位置に描く名札。
  # TrinityForge の頭上表示とちょうど同じ高さに出るため、既定はマスター (=true) 追従。
  custom-model-nametag: true
  # ボス位置追跡バー ("$name: $distance blocks away!")。距離と方角を出すもので
  # TrinityForge に相当機能が無い＝重複表示ではないため、既定では抑制しません (false)。
  # ボスバーの表示枠を TrinityForge 側に明け渡したい場合だけ true にしてください。
  boss-tracking-bar: false

# ---------------------------------------------------------------------------
# EliteMobs 独自ドロップ経路の許可 (2026-08-01)
# ---------------------------------------------------------------------------
# TrinityForge が設定するモブドロップは combat/mob-overrides.yml の drops: と
# combat/mob-level-table.yml の add-drops: の2つだけで、どちらも EntityDeathEvent へ
# 後段 (HIGH / MONITOR) から追加されます。一方 EliteMobs 自身は「エリート戦利品」を
# EntityDeathEvent を通さずプレイヤーへ直接渡す経路を複数持っており、そちらは
# TrinityForge の設定を一切経由しません。「設定していないアイテムが落ちる」の実体はこれです。
# ここではその経路を1つずつ止められます。どれを止めたかは起動時にログへ1行出ます。
#
# 既定を「止める」にした理由:
#   ランダム生成品・特殊枠・スクロール・バニラ増殖は、アイテムのステータス/品質/入手経路を
#   TrinityForge が一元管理する構成では「設定していないのに落ちるアイテム」そのものになるため。
# 既定を「残す」にした理由:
#   uniqueLootList はそのボスのために書かれた意図的なコンテンツで、通貨はギルド機能の前提のため。
#   これらまで黙って消すと別のバグ報告になります。
#
# TrinityForge 未導入時はすべてのキーが無視され、素の EliteMobs と同じ挙動になります。
elite-drop-sources:
  # ランダムエリート戦利品プール (procedural / weighed / fixed / limited / scalable)。
  # ItemSettings.yml の各 weight で選ばれる EliteMobs 独自のアイテム生成。
  random-loot: false
  # SpecialItemSystems.yml の特殊アイテム追加ドロップ。
  special-loot: false
  # エリートスクロール (ItemSettings.yml の useEliteItemScrolls)。
  elite-scroll: false
  # バニラドロップの増殖 (ItemSettings.yml の defaultLootMultiplier)。
  # レベル×0.1×倍率 回だけ同じスタックを追加で地面へ落とす処理で、dropsVanillaLoot: true の
  # モブだけが対象です。バニラドロップ「そのもの」は下の vanilla-loot 側で制御します。
  vanilla-loot-multiplier: false
  # dropsVanillaLoot: true のモブが落とすバニラドロップそのもの。
  # false にすると dropsVanillaLoot: false のモブと同じく EntityDeathEvent の drops を空にします
  # (TrinityForge 側の追加ドロップは後段で足されるので影響を受けません)。
  vanilla-loot: true
  # ギルド通貨 (EliteCoin) のドロップシャワー。
  currency-shower: true
  # custombosses/*.yml の uniqueLootList (そのボス専用に書かれたドロップ)。
  boss-unique-loot: true
